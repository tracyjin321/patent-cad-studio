name: Component Library Quality Gate
on:
  push:
    paths: ["app/**", "component_library/**", "scripts/validate_component_library.py", "tests/**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/validate_component_library.py
      - run: PYTHONPATH=. pytest -q
